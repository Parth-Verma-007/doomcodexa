# Local development: Mongo only.
#
# The API runs on the host (`npm run dev`) rather than in a container, because
# it spawns compilers as child processes and therefore needs the toolchains that
# are installed on your machine. This file exists only to provide Mongo; use
# `npm run db:local` instead if you would rather not run Docker at all.

name: codexa-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    command: ['--wiredTigerCacheSizeGB', '0.5']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
