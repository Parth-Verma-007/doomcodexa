name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The shared package emits the types every other workspace compiles against.
      - name: Build shared contracts
        run: npm run build -w @codexa/shared

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Includes the CRDT convergence test — the correctness heart of the app (§14).
      # No auth configuration: the suite signs its fixtures up through the real
      # routes, against an in-memory MongoDB.
      - name: Unit and integration tests
        run: npm test

  build:
    name: Build web and API
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  api-image:
    name: API image
    runs-on: ubuntu-latest
    needs: verify
    # The API connects to Mongo before it binds a port, so a container with no
    # database reachable never starts listening and the liveness poll below has
    # nothing to answer it. Booting it degraded is not the behaviour we want
    # either — losing the database should be loud.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the deployable API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: codexa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; this proves the thing actually runs. Boot
      # it with execution disabled and no database, and check the liveness
      # route answers — that route deliberately does not touch Mongo.
      # NODE_ENV=development is not incidental. The image bakes in
      # NODE_ENV=production, and config.ts *deliberately* refuses to boot in
      # production without METRICS_PASSWORD — that refusal is a feature
      # (docs/SECURITY.md §7). Without this override the container dies during
      # module evaluation, and the loop below polls a corpse for sixty seconds.
      # This job is checking that the image is well-formed and the toolchains
      # are present, not that the production config gate works.
      # `--network host` rather than `-p`: the Mongo service is published on the
      # runner's loopback, and inside a bridged container 127.0.0.1 is the
      # container itself. Sharing the host network is what lets the API reach it
      # and still be curl-able on 4000 below.
      - name: Boot it and check liveness
        run: |
          docker run -d --name codexa-api --network host \
            -e NODE_ENV=development \
            -e EXEC_DISABLED=1 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/codexa_ci \
            codexa-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "API answered on attempt $i"
              docker rm -f codexa-api
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy:"
          docker logs codexa-api
          exit 1

      # The image ships compilers so the Run button works on a managed host;
      # if one goes missing the button fails at runtime, not at build time.
      - name: Check the toolchains are present
        run: |
          docker run --rm codexa-api:ci sh -c '
            set -e
            gcc --version | head -1
            g++ --version | head -1
            javac -version
            python3 --version
          '

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @codexa/shared
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @codexa/web
        env:
          MONGODB_URI: mongodb://localhost:27017/codexa_e2e
