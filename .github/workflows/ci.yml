name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The shared package emits the types every other workspace compiles against.
      - name: Build shared contracts
        run: npm run build -w @codexa/shared

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Includes the CRDT convergence test — the correctness heart of the app (§14).
      - name: Unit and integration tests
        run: npm test
        env:
          AUTH_DEV_BYPASS: '1'

  build:
    name: Build web and API
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder

  api-image:
    name: API image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the deployable API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: codexa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; this proves the thing actually runs. Boot
      # it with execution disabled and no database, and check the liveness
      # route answers — that route deliberately does not touch Mongo.
      - name: Boot it and check liveness
        run: |
          docker run -d --name codexa-api -p 4000:4000 \
            -e EXEC_DISABLED=1 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/unused \
            -e AUTH_DEV_BYPASS=1 \
            codexa-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "API answered on attempt $i"
              docker rm -f codexa-api
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy:"
          docker logs codexa-api
          exit 1

      # The image ships compilers so the Run button works on a managed host;
      # if one goes missing the button fails at runtime, not at build time.
      - name: Check the toolchains are present
        run: |
          docker run --rm codexa-api:ci sh -c '
            set -e
            gcc --version | head -1
            g++ --version | head -1
            javac -version
            python3 --version
          '

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @codexa/shared
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @codexa/web
        env:
          MONGODB_URI: mongodb://localhost:27017/codexa_e2e
          AUTH_DEV_BYPASS: '1'
