<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The mark on its own tile.

    A favicon is a separate document, so it cannot reach the app's CSS variables
    and has to carry fixed colours. It keeps its own dark tile rather than
    sitting on the browser's, because tab strips are near-white in the light
    theme and the violet would be left floating with nothing behind it.

    The geometry is the same path as components/Logo.tsx, drawn from 0 and
    scaled up: the mark spans 20 units there, 36 here, centred on 64.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2044" />
      <stop offset="1" stop-color="#120c20" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a4ff" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <g transform="translate(14 14) scale(1.8)">
    <path
      fill="url(#mark)"
      fill-rule="evenodd"
      d="M20 0 L10 0 A10 10 0 0 0 0 10 L0 20 L10 20 A10 10 0 0 0 20 10 Z
         M16.8 3.2 L10.8 3.2 A6 6 0 0 0 4.8 9.2 L4.8 15.2 L10.8 15.2 A6 6 0 0 0 16.8 9.2 Z"
    />
  </g>
</svg>
